<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>מעקב ספורט</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#243247;
    --accent:#22d3ee;
    --accent2:#818cf8;
    --pink:#f472b6;
    --purple:#a78bfa;
    --orange:#fb923c;
    --orange2:#f97316;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --good:#34d399;
    --danger:#f87171;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior-y:contain;}

  header{padding:14px 20px 6px;display:flex;align-items:center;gap:12px;}
  header h1{font-size:19px;margin:0;font-weight:700;flex:1;}
  header .date{font-size:12px;color:var(--muted);margin-top:2px;}
  .back-btn{background:var(--card);border:none;color:var(--text);font-size:20px;
    width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .back-btn:active{background:var(--card2);}

  main{padding:0 16px 40px;display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* ===== Home ===== */
  #screen-home.active{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    max-width:480px;margin:0 auto;
    overflow:hidden;
  }
  .tiles{
    flex:1;min-height:0;
    position:relative;
    margin:2px 16px 8px;
  }
  .tiles .tile{position:absolute;}

  .tile{border:none;border-radius:22px;cursor:pointer;text-align:center;
    transition:transform .1s ease;padding:0;color:inherit;font-family:inherit;min-height:0;}
  .tile:active{transform:scale(.97);}

  .tile-ex{
    background:linear-gradient(150deg,var(--accent) 0%,var(--accent2) 100%);
    box-shadow:0 8px 22px rgba(34,211,238,.25);
    overflow:hidden;padding:0;
    border-radius:50%;
    position:absolute;
  }
  .tile-ex.not-done{
    background:linear-gradient(150deg,#fda4af 0%,#f87171 100%);
    box-shadow:0 8px 22px rgba(248,113,113,.22);
  }
  .tile-ex svg{
    position:absolute;left:10%;right:10%;top:20%;bottom:6%;
    width:80%;height:74%;opacity:.92;
  }
  .tile-ex .tile-name{
    position:absolute;top:8%;left:0;right:0;
    font-size:clamp(11px,3.5vw,15px);font-weight:900;color:#0b1220;letter-spacing:.2px;white-space:nowrap;
  }

  .tile-stats{
    background:linear-gradient(135deg,var(--pink),var(--purple));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border-radius:0;
    box-shadow:0 8px 22px rgba(244,114,182,.3);
  }
  .tile-stats .tile-name{
    font-size:clamp(11px,3.6vw,15px);font-weight:900;color:#0b1220;
  }
  .tile-stats .mini-bars{display:flex;align-items:flex-end;gap:3px;height:18px;}
  .tile-stats .mini-bars span{width:6px;border-radius:2px;background:#0b1220;opacity:.75;}

  .tile-aerobic{
    flex:0 0 auto;
    height:62px;
    margin:0 16px;
    margin-bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
    background:linear-gradient(135deg,var(--orange),var(--orange2));
    box-shadow:0 8px 22px rgba(251,146,60,.3);
    display:flex;align-items:center;justify-content:center;gap:12px;
    border:none;border-radius:20px;cursor:pointer;
    transition:transform .1s ease;font-family:inherit;
  }
  .tile-aerobic:active{transform:scale(.97);}
  .tile-aerobic svg{height:34px;width:auto;}
  .tile-aerobic .tile-name{font-size:22px;font-weight:900;color:#0b1220;}
  .tile-aerobic .tile-sub{font-size:11px;font-weight:600;color:rgba(11,18,32,.65);}

  /* ===== Cards ===== */
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.25);margin-bottom:16px;}
  .card-title{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .card-title .emoji{font-size:20px;}
  .card-title .note{font-size:10px;color:var(--muted);font-weight:400;margin-right:auto;max-width:55%;text-align:left;}
  .card-title.clickable{cursor:pointer;margin-bottom:0;}
  .card-title .arrow{margin-right:auto;color:var(--muted);font-size:13px;}

  .counter-row{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:16px;}
  .counter-btn{width:56px;height:56px;border-radius:50%;border:none;
    background:var(--card2);color:var(--text);font-size:26px;font-weight:700;
    display:flex;align-items:center;justify-content:center;transition:transform .08s ease;}
  .counter-btn:active{transform:scale(.9);background:#2f3f59;}
  .counter-value{font-size:44px;font-weight:800;min-width:120px;text-align:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .quick-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:8px 14px;border-radius:999px;background:var(--card2);color:var(--muted);
    font-size:14px;border:none;font-weight:600;font-family:inherit;}
  .chip:active{background:#2f3f59;color:var(--text);}
  .chip.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;}

  .level-wrap{margin-bottom:16px;}
  .level-label{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px;}
  .level-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .level-chips .chip{padding:7px 0;width:36px;text-align:center;}

  .add-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;
    box-shadow:0 6px 16px rgba(34,211,238,.25);font-family:inherit;}
  .add-btn:active{transform:scale(.98);}

  .today-line{text-align:center;font-size:13px;color:var(--muted);margin-top:12px;}
  .today-line b{color:var(--accent);}

  .sets-list{display:flex;flex-direction:column;gap:8px;}
  .set-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--card2);border-radius:12px;padding:10px 14px;}
  .set-row .left{display:flex;align-items:center;gap:10px;}
  .set-row .badge{background:var(--accent);color:#0b1220;font-weight:800;font-size:14px;
    border-radius:8px;padding:4px 10px;min-width:34px;text-align:center;white-space:nowrap;}
  .set-row .lvl{font-size:11px;color:var(--muted);background:var(--card);border-radius:6px;padding:3px 7px;}
  .set-row .time{color:var(--muted);font-size:12px;}
  .set-row .del{background:none;border:none;color:var(--danger);font-size:18px;padding:4px 8px;}
  .set-row .edit{background:none;border:none;font-size:15px;padding:4px 8px;}
  .set-row .ex-emoji{font-size:16px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}

  canvas{width:100%;display:block;}

  /* mini table */
  table.mini{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:12px;}
  .mini th{color:var(--muted);font-weight:600;font-size:11px;padding:0 4px 2px;text-align:center;}
  .mini th:first-child{text-align:right;}
  .mini td{padding:9px 4px;text-align:center;background:var(--card2);}
  .mini td:first-child{text-align:right;padding-right:10px;border-radius:0 10px 10px 0;font-weight:700;font-size:12px;white-space:nowrap;}
  .mini td:last-child{border-radius:10px 0 0 10px;}
  .mini td b{color:var(--purple);font-size:13px;}

  /* goals */
  .goal-block{margin-bottom:14px;}
  .goal-block:last-child{margin-bottom:0;}
  .goal-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .goal-head .g-name{font-size:13px;font-weight:700;flex:1;}
  .goal-head input{width:64px;padding:6px;border-radius:10px;border:none;background:var(--card2);
    color:var(--text);font-size:14px;font-weight:700;text-align:center;font-family:inherit;}
  .goal-head .g-unit{font-size:11px;color:var(--muted);}
  .progress-wrap{background:var(--card2);border-radius:999px;height:12px;overflow:hidden;direction:ltr;}
  .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .4s ease;min-width:0;}
  .progress-bar.done{background:linear-gradient(90deg,var(--good),#6ee7b7);}
  .goal-text{font-size:11px;color:var(--muted);margin-top:4px;}

  .chart-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .chart-chips .chip{font-size:12px;padding:6px 12px;}
  .mode-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .mode-row .chip{font-size:12px;padding:6px 14px;}
  .avg-line{margin-right:auto;font-size:13px;color:var(--muted);}
  .avg-line b{color:var(--accent);font-size:16px;}

  .points-today{display:block;width:100%;text-align:center;font-size:13px;color:var(--muted);
    margin-bottom:10px;background:none;border:none;font-family:inherit;padding:4px;}
  .points-today b{color:var(--pink);font-size:18px;}
  .pt-hint{font-size:11px;color:var(--muted);opacity:.8;}
  .pt-chart-hint{text-align:center;font-size:10px;color:var(--muted);opacity:.7;margin-top:6px;}
  #pointsBreakdown{margin-bottom:12px;}
  .pb-title{font-size:12px;font-weight:700;color:var(--pink);margin-bottom:8px;text-align:center;}
  .pb-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
  .pb-row .pb-name{width:104px;font-weight:700;white-space:nowrap;}
  .pb-row .pb-track{flex:1;background:var(--card2);border-radius:999px;height:14px;overflow:hidden;direction:ltr;}
  .pb-row .pb-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--purple));min-width:2px;}
  .pb-row .pb-pct{width:74px;text-align:left;color:var(--muted);font-size:11px;white-space:nowrap;}
  .pb-row .pb-pct b{color:var(--pink);font-size:12px;}

  /* history */
  #historyList{margin-top:14px;}
  .day-row{background:var(--card2);border-radius:14px;margin-bottom:8px;overflow:hidden;}
  .day-head{display:flex;align-items:center;padding:12px 14px;gap:10px;cursor:pointer;}
  .day-head .d-date{font-weight:700;font-size:14px;flex:1;}
  .day-head .d-info{font-size:12px;color:var(--muted);}
  .day-head .d-total{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;
    font-weight:800;font-size:13px;border-radius:8px;padding:4px 10px;white-space:nowrap;border:none;font-family:inherit;}
  .day-head .d-trash{background:none;border:none;color:var(--danger);font-size:16px;padding:2px 6px;}
  .day-body{display:none;padding:0 14px 12px;}
  .day-row.open .day-body{display:block;}
  .day-body .set-row{background:var(--card);margin-bottom:6px;}
  .day-breakdown{padding:4px 0 8px;}

  .edit-btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:700;
    background:rgba(129,140,248,.14);color:var(--accent2);border:1px solid rgba(129,140,248,.4);font-family:inherit;}
  .edit-btn.on{background:rgba(129,140,248,.3);color:#c7d2fe;}
  .edit-btn:active{background:rgba(129,140,248,.35);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--good);color:#052e19;font-weight:700;padding:10px 20px;border-radius:999px;
    font-size:14px;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="screen active" id="screen-home">
  <header>
    <div>
      <h1>💪 מעקב ספורט</h1>
      <div class="date" id="todayLabel"></div>
    </div>
  </header>

  <div class="tiles">

    <button class="tile tile-ex" data-ex="pullups">
      <span class="tile-name">מתח</span>
      <svg viewBox="0 0 180 150" fill="none" stroke="#0b1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="22" x2="162" y2="22"/>
        <circle cx="90" cy="52" r="12" fill="#0b1220"/>
        <line x1="90" y1="64" x2="90" y2="100"/>
        <polyline points="90,68 70,48 63,24"/>
        <polyline points="90,68 110,48 117,24"/>
        <polyline points="90,100 78,118 88,132"/>
        <polyline points="90,100 102,118 92,130"/>
      </svg>
    </button>

    <button class="tile tile-ex" data-ex="hang">
      <span class="tile-name">תליה פסיבית</span>
      <svg viewBox="0 0 180 170" fill="none" stroke="#0b1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="162" y2="20"/>
        <circle cx="90" cy="72" r="12" fill="#0b1220"/>
        <line x1="90" y1="84" x2="90" y2="122"/>
        <line x1="90" y1="88" x2="68" y2="24"/>
        <line x1="90" y1="88" x2="112" y2="24"/>
        <line x1="90" y1="122" x2="82" y2="158"/>
        <line x1="90" y1="122" x2="98" y2="158"/>
      </svg>
    </button>

    <button class="tile tile-ex" data-ex="abs">
      <span class="tile-name">בטן</span>
      <svg viewBox="0 0 180 170" fill="none" stroke="#0b1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="14" y1="150" x2="166" y2="150"/>
        <circle cx="52" cy="86" r="12" fill="#0b1220"/>
        <polyline points="60,96 88,118 118,118"/>
        <polyline points="118,118 136,92 130,148"/>
        <polyline points="60,100 78,80 92,92"/>
      </svg>
    </button>

    <button class="tile tile-ex" data-ex="handstand">
      <span class="tile-name">עמידת ידיים</span>
      <svg viewBox="0 0 130 170" fill="none" stroke="#0b1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="14" y1="158" x2="116" y2="158"/>
        <circle cx="65" cy="128" r="12" fill="#0b1220"/>
        <line x1="65" y1="116" x2="65" y2="66"/>
        <line x1="65" y1="112" x2="44" y2="158"/>
        <line x1="65" y1="112" x2="86" y2="158"/>
        <polyline points="65,66 52,34 60,10"/>
        <polyline points="65,66 80,38 74,12"/>
      </svg>
    </button>

    <button class="tile tile-ex" data-ex="jumps">
      <span class="tile-name">קפיצות</span>
      <svg viewBox="0 0 180 150" fill="none" stroke="#0b1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="20" y1="142" x2="70" y2="142"/>
        <line x1="110" y1="142" x2="160" y2="142"/>
        <circle cx="90" cy="38" r="12" fill="#0b1220"/>
        <line x1="90" y1="50" x2="90" y2="86"/>
        <polyline points="90,56 68,42 58,18"/>
        <polyline points="90,56 112,42 122,18"/>
        <polyline points="90,86 72,104 80,122"/>
        <polyline points="90,86 108,104 100,122"/>
      </svg>
    </button>

    <button class="tile tile-stats" id="tileStats">
      <div class="mini-bars"><span style="height:35%"></span><span style="height:60%"></span><span style="height:45%"></span><span style="height:100%"></span></div>
      <span class="tile-name">סטטיסטיקה</span>
    </button>

  </div>

  <button class="tile-aerobic" data-ex="aerobic">
    <svg viewBox="0 0 170 150" fill="none" stroke="#0b1220" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="112" cy="30" r="12" fill="#0b1220"/>
      <polyline points="104,44 82,66 100,88"/>
      <polyline points="100,88 76,110 60,134"/>
      <polyline points="100,88 118,108 140,116"/>
      <polyline points="82,66 58,72 38,58"/>
      <polyline points="104,50 126,62 148,54"/>
    </svg>
    <span class="tile-name">אירובי</span>
    <span class="tile-sub" id="aerobicSub"></span>
  </button>
</div>

<!-- ============ GENERIC LOG SCREEN ============ -->
<div class="screen" id="screen-log">
  <header>
    <button class="back-btn" data-back>→</button>
    <div>
      <h1 id="logTitle"></h1>
      <div class="date" id="logDateLabel"></div>
    </div>
  </header>
  <main>
    <div class="card">
      <p class="card-title"><span class="emoji">✏️</span> <span id="logQuestion"></span></p>
      <div class="counter-row">
        <button class="counter-btn" id="minusBtn">−</button>
        <div class="counter-value" id="counterVal"></div>
        <button class="counter-btn" id="plusBtn">+</button>
      </div>
      <div class="quick-chips" id="quickChips"></div>
      <div class="level-wrap" id="levelWrap" style="display:none">
        <div class="level-label">רמת קושי (1–10)</div>
        <div class="level-chips" id="levelChips"></div>
      </div>
      <button class="add-btn" id="addBtn">✅ הוסף סט</button>
      <div class="today-line" id="todayLine"></div>
    </div>
  </main>
</div>

<!-- ============ STATS ============ -->
<div class="screen" id="screen-stats">
  <header>
    <button class="back-btn" data-back>→</button>
    <div><h1>📊 סטטיסטיקה</h1></div>
  </header>
  <main>

    <div class="card">
      <p class="card-title"><span class="emoji">🏆</span> סיכום לפי תרגיל</p>
      <table class="mini">
        <thead><tr><th>תרגיל</th><th>ימים ברצף</th><th>ממוצע ליום</th></tr></thead>
        <tbody id="miniTableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">🎯</span> יעדים יומיים</p>
      <div id="goalsList"></div>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">📅</span> גרף אימונים</p>
      <div class="chart-chips" id="chartChips"></div>
      <div class="mode-row">
        <button class="chip" id="modeDay">ימים</button>
        <button class="chip" id="modeWeek">שבועות</button>
        <span class="avg-line" id="avgLine"></span>
      </div>
      <canvas id="mainChart" height="180" dir="ltr"></canvas>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">⭐</span> נקודות <span class="note">מתח=1 · שניית תליה=0.5 · דקת בטן=8 · ע.ידיים=שניות×רמה · קפיצה=1 · אירובי=50+רמה</span></p>
      <button class="points-today" id="pointsTodayBtn">היום: <b id="pointsToday">0</b> נקודות <span class="pt-hint" id="ptHint">▾ לחץ לפירוט</span></button>
      <div id="pointsBreakdown" style="display:none"></div>
      <canvas id="pointsChart" height="170" dir="ltr"></canvas>
      <div class="pt-chart-hint">💡 לחץ על נקודה בגרף לפירוט של יום ספציפי</div>
    </div>

    <div class="card">
      <p class="card-title clickable" id="historyToggle"><span class="emoji">📚</span> היסטוריית אימונים <span class="arrow" id="historyArrow">▾ פתח</span></p>
      <div id="historyList" style="display:none"></div>
    </div>

    <button class="edit-btn" id="editBtn">✏️ ערוך נתונים</button>

  </main>
</div>

<div class="toast" id="toast">נשמר!</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "sportapp_sets_v1";
  const GOALS_KEY = "sportapp_goals_v1";
  const OLD_GOAL_KEY = "sportapp_goal_v1";
  const LEVEL_KEY = "sportapp_level_v1";

  function fmtSecs(v){
    const m = Math.floor(v/60), s = Math.round(v%60);
    if(m === 0) return s + " שנ׳";
    return m + ":" + String(s).padStart(2,"0");
  }

  const EXERCISES = {
    pullups:   { name:"מתח", emoji:"🧗", unit:"חזרות", step:1, min:0, max:500, def:8,
                 chips:[5,8,10,12,15], fmt:v=>String(v), hasLevel:false, goalDef:50 },
    hang:      { name:"תליה פסיבית", emoji:"🪢", unit:"שניות", step:10, min:0, max:900, def:50,
                 chips:[30,50,60,70,90], fmt:fmtSecs, hasLevel:false, goalDef:120 },
    abs:       { name:"בטן", emoji:"🔥", unit:"דקות", step:1, min:0, max:180, def:4,
                 chips:[3,4,5,6,8], fmt:v=>v+" דק׳", hasLevel:false, goalDef:10 },
    handstand: { name:"עמידת ידיים", emoji:"🤸", unit:"שניות", step:1, min:0, max:600, def:20,
                 chips:[10,15,20,30,45], fmt:fmtSecs, hasLevel:true, goalDef:100 },
    jumps:     { name:"קפיצות", emoji:"🦘", unit:"קפיצות", step:1, min:0, max:5000, def:50,
                 chips:[20,50,100,150,200], fmt:v=>String(v), hasLevel:false, goalDef:200 },
    aerobic:   { name:"אירובי", emoji:"🏃", unit:"רמת קושי", step:1, min:1, max:50, def:25,
                 chips:[10,20,30,40,50], fmt:v=>"רמה "+v, hasLevel:false, goalDef:30 }
  };
  const EX_KEYS = Object.keys(EXERCISES);

  function setPoints(s){
    switch(s.exercise){
      case "pullups":   return s.val;
      case "hang":      return s.val * 0.5;
      case "abs":       return s.val * 8;
      case "handstand": return s.val * (s.level || 1);
      case "jumps":     return s.val;
      case "aerobic":   return 50 + s.val;
    }
    return 0;
  }

  /* ---------- data ---------- */
  function loadSets(){
    try{
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      return raw.map(s => s.val === undefined ? Object.assign({}, s, {val: s.reps || 0}) : s);
    }catch(e){ return []; }
  }
  function saveSets(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(sets)); }

  function loadGoals(){
    let g = {};
    try{ g = JSON.parse(localStorage.getItem(GOALS_KEY)) || {}; }catch(e){}
    const old = parseInt(localStorage.getItem(OLD_GOAL_KEY), 10);
    EX_KEYS.forEach(k=>{
      if(!(g[k] >= 1)) g[k] = (k === "pullups" && old >= 1) ? old : EXERCISES[k].goalDef;
    });
    if(g.handstand === 60) g.handstand = 100; // migrate old default
    return g;
  }
  function saveGoals(){ localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }

  let sets = loadSets();
  let goals = loadGoals();
  let level = parseInt(localStorage.getItem(LEVEL_KEY), 10) || 5;
  let currentEx = "pullups";
  let chartEx = "pullups";
  let chartMode = "day";
  let historyOpen = false;
  let editMode = false;
  const counters = {};
  EX_KEYS.forEach(k=>{
    const v = parseInt(localStorage.getItem("sportapp_counter_" + k), 10);
    counters[k] = (v >= 0 ? v : EXERCISES[k].def) || EXERCISES[k].def;
  });
  const openDays = new Set();

  /* ---------- helpers ---------- */
  function dayKey(ts){
    const d = new Date(ts);
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }
  function startOfDay(offsetDays){
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + offsetDays);
    return d;
  }
  function exSets(ex){ return sets.filter(s => s.exercise === ex); }
  function totalForKey(ex, key){
    return exSets(ex).filter(s => dayKey(s.ts) === key).reduce((sum,x)=> sum + x.val, 0);
  }
  function todaysSets(ex){
    const tk = dayKey(Date.now());
    return exSets(ex).filter(s => dayKey(s.ts) === tk).sort((a,b)=> b.ts - a.ts);
  }
  function fmtDate(d){
    return d.toLocaleDateString("he-IL", { weekday:"long", day:"numeric", month:"long" });
  }

  /* ---------- navigation ---------- */
  const screens = {
    home: document.getElementById("screen-home"),
    log: document.getElementById("screen-log"),
    stats: document.getElementById("screen-stats")
  };
  function route(){
    const h = (location.hash || "").replace("#","");
    let name = "home";
    if(h === "stats") name = "stats";
    else if(h.startsWith("log/")){
      const ex = h.slice(4);
      if(EXERCISES[ex]){ name = "log"; currentEx = ex; }
    }
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
    window.scrollTo(0,0);
    if(name === "home") renderHome();
    if(name === "log") renderLog();
    if(name === "stats") renderStats();
  }
  window.addEventListener("hashchange", route);
  document.querySelectorAll("[data-ex]").forEach(t =>
    t.addEventListener("click", ()=> location.hash = "log/" + t.getAttribute("data-ex")));
  document.getElementById("tileStats").addEventListener("click", ()=> location.hash = "stats");
  document.querySelectorAll("[data-back]").forEach(b =>
    b.addEventListener("click", ()=> { location.hash = ""; }));

  /* ---------- toast ---------- */
  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove("show"), 1300);
  }

  /* ---------- HOME ---------- */
  const RADIAL_ORDER = ["pullups","hang","abs","handstand","jumps"];

  function polyPoints(n, scale){
    const pts = [];
    for(let i=0;i<n;i++){
      const a = -Math.PI/2 + i*2*Math.PI/n;
      pts.push((50 + 50*scale*Math.cos(a)).toFixed(1) + "% " +
               (50 + 50*scale*Math.sin(a)).toFixed(1) + "%");
    }
    return "polygon(" + pts.join(",") + ")";
  }

  function layoutHome(){
    if(!screens.home.classList.contains("active")) return;
    const cont = document.querySelector(".tiles");
    const W = cont.clientWidth, H = cont.clientHeight;
    if(W === 0 || H === 0) return;
    const order = RADIAL_ORDER.filter(ex => document.querySelector('.tile-ex[data-ex="' + ex + '"]'));
    const n = order.length;

    const gap = 10;
    const chord = 2 * Math.sin(Math.PI / n);
    let D = Math.min(W * 0.30, H * 0.19, 140);
    let R = Math.min(W/2 - D/2 - 4, H/2 - D/2 - 4);
    for(let k=0; k<8 && chord * R < D + gap; k++){
      D = chord * R - gap;
      R = Math.min(W/2 - D/2 - 4, H/2 - D/2 - 4);
    }
    const cx = W/2, cy = H/2;

    order.forEach((ex,i)=>{
      const t = document.querySelector('.tile-ex[data-ex="' + ex + '"]');
      const a = -Math.PI/2 + i*2*Math.PI/n;
      const x = cx + R*Math.cos(a);
      const y = cy + R*Math.sin(a);
      t.style.width = D + "px";
      t.style.height = D + "px";
      t.style.left = (x - D/2) + "px";
      t.style.top = (y - D/2) + "px";
    });

    const st = document.getElementById("tileStats");
    const ssz = Math.max(70, 2 * (R - D/2 - 8));
    st.style.width = ssz + "px";
    st.style.height = ssz + "px";
    st.style.left = (cx - ssz/2) + "px";
    st.style.top = (cy - ssz/2) + "px";
    st.style.clipPath = polyPoints(n, 1);
    st.style.webkitClipPath = polyPoints(n, 1);
  }

  function renderHome(){
    document.getElementById("todayLabel").textContent = fmtDate(new Date());
    RADIAL_ORDER.forEach(ex=>{
      const t = document.querySelector('.tile-ex[data-ex="' + ex + '"]');

      t.classList.toggle("not-done", todaysSets(ex).length === 0);

    aSub.textContent = aToday.length ? "✔ בוצע היום" : "";
    requestAnimationFrame(layoutHome);
  }

  function renderTodayLine(){
    const c = cfg();

  document.getElementById("addBtn").addEventListener("click", ()=>{

    const entry = { id: Date.now() + "_" + Math.random().toString(36).slice(2),

  function renderLog(){
    const c = cfg();
    document.getElementById("logTitle").textContent = c.emoji + " " + c.name;
    document.getElementById("logDateLabel").textContent = fmtDate(new Date());
    document.getElementById("logQuestion").textContent =
      currentEx === "aerobic" ? "מה רמת הקושי של התרגיל?" :

      c.unit === "קפיצות" ? "כמה קפיצות עשית?" :
      c.unit === "דקות" ? "כמה דקות עשית?" : "כמה שניות החזקת?";
    buildChips();
    buildLevels();
    renderCounter();
    renderTodayLine();

  /* ---------- STATS: mini table ---------- */
  function exStreak(ex){
    const has = key => exSets(ex).some(s => dayKey(s.ts) === key);
    let streak = 0;
    let offset = has(dayKey(startOfDay(0).getTime())) ? 0 : -1;
    while(true){
      const key = dayKey(startOfDay(offset - streak).getTime());
      if(has(key)) streak++;
      else break;
    }
    return streak;
  }

  function renderTable(){
    const body = document.getElementById("miniTableBody");
    body.innerHTML = "";
    EX_KEYS.forEach(ex=>{
      const c = EXERCISES[ex];
      const all = exSets(ex);
      let avgTxt = "—";
      if(all.length){
        let firstTs = Math.min.apply(null, all.map(s => s.ts));
        const first = new Date(firstTs); first.setHours(0,0,0,0);
        const nDays = Math.round((startOfDay(0) - first) / 86400000) + 1;
        const totalVal = all.reduce((s,x)=> s + x.val, 0);
        const avgVal = Math.round(totalVal / nDays);
        avgTxt = avgVal ? c.fmt(avgVal) : "0";
      }
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + c.emoji + " " + c.name + "</td>" +
        "<td><b>" + exStreak(ex) + "</b></td>" +
        "<td><b>" + avgTxt + "</b></td>";
      body.appendChild(tr);
    });
  }

  /* ---------- STATS: goals ---------- */
  function renderGoals(){
    const wrap = document.getElementById("goalsList");
    wrap.innerHTML = "";
    EX_KEYS.forEach(ex=>{
      const c = EXERCISES[ex];
      const g = goals[ex];
      const done = totalForKey(ex, dayKey(Date.now()));
      const pct = Math.min(100, Math.round(done / g * 100));
      const block = document.createElement("div");
      block.className = "goal-block";
      block.innerHTML =
        '<div class="goal-head">' +
          '<span class="g-name">' + c.emoji + ' ' + c.name + '</span>' +
          '<input type="number" min="1" max="10000" inputmode="numeric" value="' + g + '" data-goal="' + ex + '">' +
          '<span class="g-unit">' + c.unit + '/יום</span>' +
        '</div>' +
        '<div class="progress-wrap"><div class="progress-bar' + (pct >= 100 ? ' done' : '') + '" style="width:' + pct + '%"></div></div>' +
        '<div class="goal-text">' + (pct >= 100 ? '🎉 עמדת ביעד! ' : '') + c.fmt(done) + ' מתוך ' + c.fmt(g) + ' (' + pct + '%)</div>';
      wrap.appendChild(block);
    });
    wrap.querySelectorAll("input[data-goal]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const v = parseInt(inp.value, 10);

        if(v >= 1 && v <= 10000){ goals[ex] = v; saveGoals(); }
        renderGoals();
      });
    });
  }

  /* ---------- canvas helpers ---------- */
  function setupCanvas(canvas, cssHeight){
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.parentElement.clientWidth - 36;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.direction = "ltr";
    return { ctx, w: cssWidth, h: cssHeight };
  }

  /* ---------- STATS: main chart ---------- */
  function buildChartControls(){
    const wrap = document.getElementById("chartChips");
    wrap.innerHTML = "";
    EX_KEYS.forEach(ex=>{
      const b = document.createElement("button");
      b.className = "chip" + (ex === chartEx ? " sel" : "");
      b.textContent = EXERCISES[ex].emoji + " " + EXERCISES[ex].name;
      b.addEventListener("click", ()=>{
        chartEx = ex;
        buildChartControls();
        renderMainChart();
      });
      wrap.appendChild(b);
    });
    document.getElementById("modeDay").className = "chip" + (chartMode === "day" ? " sel" : "");
    document.getElementById("modeWeek").className = "chip" + (chartMode === "week" ? " sel" : "");
  }
  document.getElementById("modeDay").addEventListener("click", ()=>{
    chartMode = "day"; buildChartControls(); renderMainChart();
  });
  document.getElementById("modeWeek").addEventListener("click", ()=>{
    chartMode = "week"; buildChartControls(); renderMainChart();
  });

  function weekStart(offsetWeeks){
    const d = startOfDay(0);
    d.setDate(d.getDate() - d.getDay() + offsetWeeks * 7);
    return d;
  }

  function renderMainChart(){
    const canvas = document.getElementById("mainChart");
    const { ctx, w, h } = setupCanvas(canvas, 180);
    const c = EXERCISES[chartEx];

    // oldest on the LEFT, newest on the RIGHT (left-to-right time axis)
    let labels = [], totals = [], highlight = -1;

    if(chartMode === "day"){
      const N = 14;
      for(let i = N-1; i >= 0; i--){
        const d = startOfDay(-i);
        totals.push(totalForKey(chartEx, dayKey(d.getTime())));
        labels.push(d.getDate() + "." + (d.getMonth()+1));
      }
      highlight = totals.length - 1;
    } else {
      const N = 12;
      for(let i = N-1; i >= 0; i--){
        const ws = weekStart(-i);
        let sum = 0;
        for(let j=0; j<7; j++){
          const d = new Date(ws); d.setDate(d.getDate()+j);
          if(d > new Date()) break;
          sum += totalForKey(chartEx, dayKey(d.getTime()));
        }
        totals.push(sum);
        labels.push(ws.getDate() + "." + (ws.getMonth()+1));
      }
      highlight = totals.length - 1;
    }

    let firstIdx = totals.findIndex(v => v > 0);
    let avg = 0;
    if(firstIdx >= 0){
      const span = totals.slice(firstIdx);
      avg = Math.round(span.reduce((a,b)=>a+b,0) / span.length);
    }
    document.getElementById("avgLine").innerHTML =
      (chartMode === "day" ? "ממוצע יומי: " : "ממוצע שבועי: ") +
      "<b>" + (avg ? c.fmt(avg) : "—") + "</b>";

    const max = Math.max(1, ...totals);
    const axisL = 34, top = 16, bottom = h - 24;
    ctx.clearRect(0,0,w,h);

    ctx.font = "600 10px sans-serif";
    [0, .5, 1].forEach(f=>{
      const y = bottom - f * (bottom - top);
      ctx.strokeStyle = "rgba(148,163,184," + (f === 0 ? ".35" : ".15") + ")";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(axisL, y); ctx.lineTo(w, y); ctx.stroke();
      ctx.fillStyle = "#94a3b8";
      ctx.textAlign = "right";
      ctx.fillText(String(Math.round(max * f)), axisL - 6, y + 3);
    });

    if(avg > 0){
      const yAvg = bottom - (avg/max) * (bottom - top);
      ctx.strokeStyle = "rgba(244,114,182,.6)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(axisL, yAvg); ctx.lineTo(w, yAvg); ctx.stroke();
      ctx.setLineDash([]);
    }

    const n = totals.length;
    const gap = 6;
    const bw = (w - axisL - gap*(n-1)) / n;

    totals.forEach((val,i)=>{
      const x = axisL + i * (bw + gap);
      if(val > 0){
        const bh = Math.max(4, (val/max) * (bottom-top));
        const y = bottom - bh;
        const grad = ctx.createLinearGradient(0, y, 0, bottom);
        grad.addColorStop(0, "#22d3ee"); grad.addColorStop(1, "#818cf8");
        ctx.fillStyle = grad;
        const r = Math.min(5, bw/2);
        ctx.beginPath();
        ctx.moveTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
        ctx.arcTo(x+bw, y, x+bw, y+r, r);
        ctx.lineTo(x+bw, bottom); ctx.lineTo(x, bottom);
        ctx.closePath(); ctx.fill();
        if(bw > 18 || val === max){
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "700 10px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(val, x + bw/2, y - 4);
        }
      }
      if(i % 2 === (n-1) % 2 || i === n-1){
        ctx.fillStyle = i === highlight ? "#e2e8f0" : "#94a3b8";
        ctx.font = (i === highlight ? "800" : "600") + " 9px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(labels[i], x + bw/2, h - 8);
      }
    });
  }

  /* ---------- STATS: points ---------- */
  function pointsForKey(key){
    return sets.filter(s => dayKey(s.ts) === key).reduce((sum,x)=> sum + setPoints(x), 0);
  }

  function renderPointsBreakdown(key, label){
    const wrap = document.getElementById("pointsBreakdown");
    wrap.innerHTML = "";
    const perEx = {};
    sets.filter(s => dayKey(s.ts) === key).forEach(s=>{
      perEx[s.exercise] = (perEx[s.exercise] || 0) + setPoints(s);
    });
    const total = Object.values(perEx).reduce((a,b)=>a+b, 0);
    if(label){
      const t = document.createElement("div");
      t.className = "pb-title";
      t.textContent = "פירוט " + label + " · " + Math.round(total) + " נק׳";
      wrap.appendChild(t);
    }
    if(total <= 0){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "אין נקודות ביום זה";
      wrap.appendChild(e);
      return;
    }
    EX_KEYS.filter(ex => perEx[ex] > 0)
      .sort((a,b)=> perEx[b] - perEx[a])
      .forEach(ex=>{
        const c = EXERCISES[ex];
        const pts = perEx[ex];
        const pct = Math.round(pts / total * 100);
        const row = document.createElement("div");
        row.className = "pb-row";
        row.innerHTML =
          '<span class="pb-name">' + c.emoji + ' ' + c.name + '</span>' +
          '<span class="pb-track"><span class="pb-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="pb-pct"><b>' + pct + '%</b> · ' + Math.round(pts) + ' נק׳</span>';
        wrap.appendChild(row);
      });
  }

  document.getElementById("pointsTodayBtn").addEventListener("click", ()=>{
    const bd = document.getElementById("pointsBreakdown");
    const open = bd.style.display !== "none";
    bd.style.display = open ? "none" : "";
    document.getElementById("ptHint").textContent = open ? "▾ לחץ לפירוט" : "▴ סגור פירוט";
    if(!open) renderPointsBreakdown(dayKey(Date.now()), "היום");
  });

  // click on a specific day in the points chart → breakdown for that day
  const pcState = { days: [], step: 0 };
  document.getElementById("pointsChart").addEventListener("click", (e)=>{
    if(pcState.days.length === 0) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    let idx = Math.round(x / pcState.step);
    idx = Math.max(0, Math.min(pcState.days.length - 1, idx));
    const d = pcState.days[idx];
    const bd = document.getElementById("pointsBreakdown");
    bd.style.display = "";
    document.getElementById("ptHint").textContent = "▴ סגור פירוט";
    renderPointsBreakdown(dayKey(d.getTime()),
      d.toLocaleDateString("he-IL", { weekday:"short", day:"numeric", month:"numeric" }));
  });

  function renderPointsChart(){
    document.getElementById("pointsToday").textContent =
      Math.round(pointsForKey(dayKey(Date.now())));
    if(document.getElementById("pointsBreakdown").style.display !== "none")
      renderPointsBreakdown(dayKey(Date.now()), "היום");

    const canvas = document.getElementById("pointsChart");
    const { ctx, w, h } = setupCanvas(canvas, 170);

    let firstTs = Date.now();
    sets.forEach(s => { if(s.ts < firstTs) firstTs = s.ts; });
    const first = new Date(firstTs); first.setHours(0,0,0,0);
    const today = startOfDay(0);
    let nDays = Math.round((today - first) / 86400000) + 1;
    if(nDays < 7) nDays = 7;
    if(nDays > 60) nDays = 60;

    // oldest on the LEFT, newest on the RIGHT
    const days = [], totals = [];
    for(let i = nDays - 1; i >= 0; i--){
      const d = startOfDay(-i);
      days.push(d);
      totals.push(pointsForKey(dayKey(d.getTime())));
    }
    const max = Math.max(1, ...totals);

    const top = 20, bottom = h - 26;
    ctx.clearRect(0,0,w,h);

    ctx.strokeStyle = "rgba(148,163,184,.25)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, bottom); ctx.lineTo(w, bottom); ctx.stroke();

    const step = totals.length > 1 ? w / (totals.length - 1) : w;
    pcState.days = days;
    pcState.step = step;
    const pts = totals.map((v,i)=> [i*step, bottom - (v/max)*(bottom-top)]);

    ctx.beginPath();
    ctx.moveTo(pts[0][0], bottom);
    pts.forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.lineTo(pts[pts.length-1][0], bottom);
    ctx.closePath();
    const fillGrad = ctx.createLinearGradient(0, top, 0, bottom);
    fillGrad.addColorStop(0, "rgba(244,114,182,.30)");
    fillGrad.addColorStop(1, "rgba(167,139,250,0)");
    ctx.fillStyle = fillGrad;
    ctx.fill();

    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
    const lineGrad = ctx.createLinearGradient(0,0,w,0);
    lineGrad.addColorStop(0, "#f472b6"); lineGrad.addColorStop(1, "#a78bfa");
    ctx.strokeStyle = lineGrad;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.stroke();

    if(totals.length <= 14){
      pts.forEach((p,i)=>{
        ctx.beginPath();
        ctx.arc(p[0], p[1], 3.5, 0, Math.PI*2);
        ctx.fillStyle = "#f472b6";
        ctx.fill();
        if(totals[i] > 0){
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "700 12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(Math.round(totals[i]), p[0], p[1] - 9);
        }
      });
    }

    ctx.fillStyle = "#94a3b8";
    ctx.font = "600 10px sans-serif";
    const tickCount = Math.min(4, totals.length);
    for(let t=0; t<tickCount; t++){
      const idx = tickCount === 1 ? 0 : Math.round(t * (totals.length-1) / (tickCount-1));
      const d = days[idx];
      ctx.textAlign = t === 0 ? "left" : (t === tickCount-1 ? "right" : "center");
      ctx.fillText(d.getDate() + "." + (d.getMonth()+1), pts[idx][0], h - 8);
    }
  }

  /* ---------- STATS: history + edit ---------- */
  function editSet(id){
    const s = sets.find(x => String(x.id) === String(id));
    if(!s) return;
    const c = EXERCISES[s.exercise] || EXERCISES.pullups;
    const nv = parseInt(prompt(c.emoji + " " + c.name + " — ערך חדש (" + c.unit + "):", s.val), 10);
    if(!isNaN(nv) && nv >= 1 && nv <= c.max) s.val = nv;
    if(c.hasLevel){
      const nl = parseInt(prompt("רמת קושי (1–10):", s.level || 5), 10);
      if(!isNaN(nl) && nl >= 1 && nl <= 10) s.level = nl;
    }
    saveSets();
    renderStats();
    showToast("עודכן ✔");
  }

  function renderHistory(){
    const wrap = document.getElementById("historyList");
    const arrow = document.getElementById("historyArrow");
    wrap.style.display = historyOpen ? "" : "none";
    arrow.textContent = historyOpen ? "▴ סגור" : "▾ פתח";
    if(!historyOpen) return;

    wrap.innerHTML = "";
    const byDay = {};
    sets.forEach(s=>{
      const k = dayKey(s.ts);
      (byDay[k] = byDay[k] || []).push(s);
    });
    const keys = Object.keys(byDay).sort((a,b)=> byDay[b][0].ts - byDay[a][0].ts);
    if(keys.length === 0){
      wrap.innerHTML = '<div class="empty">אין עדיין נתונים — ההיסטוריה תופיע כאן</div>';
      return;
    }
    keys.forEach(k=>{
      const daySets = byDay[k].sort((a,b)=> b.ts - a.ts);
      const d = new Date(daySets[0].ts);
      const dayPts = Math.round(daySets.reduce((s,x)=> s + setPoints(x), 0));
      const row = document.createElement("div");
      row.className = "day-row" + (openDays.has(k) ? " open" : "");
      row.innerHTML =
        '<div class="day-head">' +
        '<span class="d-date">' + d.toLocaleDateString("he-IL",{weekday:"short", day:"numeric", month:"numeric"}) + '</span>' +
        '<span class="d-info">' + daySets.length + ' סטים</span>' +
        '<button class="d-total">⭐ ' + dayPts + '</button>' +
        (editMode ? '<button class="d-trash" title="מחק יום">🗑️</button>' : '') +
        '</div><div class="day-breakdown" style="display:none"></div><div class="day-body"></div>';
      const body = row.querySelector(".day-body");
      daySets.forEach(s=>{
        const c = EXERCISES[s.exercise] || EXERCISES.pullups;
        const time = new Date(s.ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
        const sr = document.createElement("div");
        sr.className = "set-row";
        sr.innerHTML = '<div class="left"><span class="ex-emoji">' + c.emoji + '</span>' +
          '<span class="badge">' + c.fmt(s.val) + '</span>' +
          (s.level ? '<span class="lvl">רמה ' + s.level + '</span>' : '') +
          '<span class="time">' + time + '</span></div>' +
          '<div>' +
          (editMode ? '<button class="edit" data-id="' + s.id + '">✏️</button>' +
                      '<button class="del" data-id="' + s.id + '">✕</button>' : '') +
          '</div>';
        body.appendChild(sr);
      });
      // day points button → per-day percentage breakdown
      row.querySelector(".d-total").addEventListener("click", (e)=>{
        e.stopPropagation();
        const bd = row.querySelector(".day-breakdown");
        if(bd.style.display !== "none"){ bd.style.display = "none"; return; }
        bd.style.display = "";
        bd.innerHTML = "";
        const perEx = {};
        daySets.forEach(s=>{ perEx[s.exercise] = (perEx[s.exercise] || 0) + setPoints(s); });
        const total = Object.values(perEx).reduce((a,b)=>a+b, 0);
        EX_KEYS.filter(ex => perEx[ex] > 0)
          .sort((a,b)=> perEx[b] - perEx[a])
          .forEach(ex=>{
            const c = EXERCISES[ex];
            const pct = Math.round(perEx[ex] / total * 100);
            const r2 = document.createElement("div");
            r2.className = "pb-row";
            r2.innerHTML =
              '<span class="pb-name">' + c.emoji + ' ' + c.name + '</span>' +
              '<span class="pb-track"><span class="pb-fill" style="width:' + pct + '%"></span></span>' +
              '<span class="pb-pct"><b>' + pct + '%</b> · ' + Math.round(perEx[ex]) + ' נק׳</span>';
            bd.appendChild(r2);
          });
      });
      row.querySelector(".day-head").addEventListener("click", (e)=>{
        if(e.target.classList.contains("d-trash") || e.target.classList.contains("d-total")) return;
        row.classList.toggle("open");
        if(row.classList.contains("open")) openDays.add(k); else openDays.delete(k);
      });
      const trash = row.querySelector(".d-trash");
      if(trash) trash.addEventListener("click", ()=>{
        if(!confirm("למחוק את כל הסטים של יום זה?")) return;
        sets = sets.filter(s => dayKey(s.ts) !== k);
        saveSets(); renderStats();
      });
      body.querySelectorAll(".del").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if(!confirm("למחוק את הסט הזה?")) return;
          sets = sets.filter(s => String(s.id) !== btn.getAttribute("data-id"));
          saveSets(); renderStats();
        });
      });
      body.querySelectorAll(".edit").forEach(btn=>{
        btn.addEventListener("click", ()=> editSet(btn.getAttribute("data-id")));
      });
      wrap.appendChild(row);
    });
  }

  document.getElementById("historyToggle").addEventListener("click", ()=>{
    historyOpen = !historyOpen;
    renderHistory();
  });

  document.getElementById("editBtn").addEventListener("click", ()=>{
    editMode = !editMode;
    const b = document.getElementById("editBtn");
    b.classList.toggle("on", editMode);
    b.textContent = editMode ? "✔ סיום עריכה" : "✏️ ערוך נתונים";
    if(editMode) historyOpen = true;
    renderHistory();
    if(editMode) document.getElementById("historyToggle").scrollIntoView({behavior:"smooth"});
  });

  function renderStats(){
    renderTable();
    renderGoals();
    buildChartControls();
    renderMainChart();
    renderPointsChart();
    renderHistory();
  }

  window.addEventListener("resize", ()=>{
    if(screens.stats.classList.contains("active")){ renderMainChart(); renderPointsChart(); }
    if(screens.home.classList.contains("active")) layoutHome();
  });

  /* ---------- init ---------- */
  route();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>

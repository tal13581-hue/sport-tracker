<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>מעקב ספורט</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#243247;
    --accent:#22d3ee;
    --accent2:#818cf8;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --good:#34d399;
    --danger:#f87171;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior-y:contain;}
  body{padding-bottom:40px;}
  header{
    padding:22px 20px 14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header h1{font-size:20px;margin:0;font-weight:700;}
  header .date{font-size:13px;color:var(--muted);margin-top:2px;}
  main{padding:0 16px;display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;}

  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.25);}
  .card-title{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--text);}
  .card-title .emoji{font-size:20px;}

  .counter-row{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:16px;}
  .counter-btn{
    width:56px;height:56px;border-radius:50%;border:none;
    background:var(--card2);color:var(--text);font-size:26px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s ease, background .15s ease;
  }
  .counter-btn:active{transform:scale(.9);background:#2f3f59;}
  .counter-value{font-size:52px;font-weight:800;min-width:90px;text-align:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .quick-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:8px 16px;border-radius:999px;background:var(--card2);color:var(--muted);
    font-size:14px;border:none;font-weight:600;}
  .chip:active{background:#2f3f59;color:var(--text);}

  .add-btn{
    width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;
    box-shadow:0 6px 16px rgba(34,211,238,.25);
  }
  .add-btn:active{transform:scale(.98);}

  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat{background:var(--card2);border-radius:14px;padding:12px 8px;text-align:center;}
  .stat .num{font-size:22px;font-weight:800;color:var(--accent);}
  .stat .label{font-size:11px;color:var(--muted);margin-top:2px;}

  .sets-list{display:flex;flex-direction:column;gap:8px;}
  .set-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--card2);border-radius:12px;padding:10px 14px;}
  .set-row .left{display:flex;align-items:center;gap:10px;}
  .set-row .badge{background:var(--accent);color:#0b1220;font-weight:800;font-size:14px;
    border-radius:8px;padding:4px 10px;min-width:34px;text-align:center;}
  .set-row .time{color:var(--muted);font-size:12px;}
  .set-row .del{background:none;border:none;color:var(--danger);font-size:18px;padding:4px 8px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}

  canvas{width:100%;display:block;}
  .chart-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--good);color:#052e19;font-weight:700;padding:10px 20px;border-radius:999px;
    font-size:14px;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div>
    <h1>💪 מעקב ספורט</h1>
    <div class="date" id="todayLabel"></div>
  </div>
</header>

<main>

  <div class="card">
    <p class="card-title"><span class="emoji">🧗</span> מתח — סט חדש</p>
    <div class="counter-row">
      <button class="counter-btn" id="minusBtn">−</button>
      <div class="counter-value" id="counterVal">8</div>
      <button class="counter-btn" id="plusBtn">+</button>
    </div>
    <div class="quick-chips" id="quickChips"></div>
    <button class="add-btn" id="addBtn">✅ הוסף סט</button>
  </div>

  <div class="card">
    <p class="card-title"><span class="emoji">📊</span> היום</p>
    <div class="stats-grid">
      <div class="stat"><div class="num" id="statSets">0</div><div class="label">סטים</div></div>
      <div class="stat"><div class="num" id="statReps">0</div><div class="label">חזרות</div></div>
      <div class="stat"><div class="num" id="statBest">0</div><div class="label">סט הכי טוב</div></div>
    </div>
  </div>

  <div class="card">
    <p class="card-title"><span class="emoji">📝</span> סטים של היום</p>
    <div class="sets-list" id="setsList"></div>
  </div>

  <div class="card">
    <p class="card-title"><span class="emoji">📈</span> 7 ימים אחרונים</p>
    <canvas id="weekChart" height="140" dir="ltr"></canvas>
    <div class="chart-labels" id="chartLabels" dir="ltr"></div>
  </div>

  <div class="card">
    <p class="card-title"><span class="emoji">🏆</span> סה"כ</p>
    <div class="stats-grid">
      <div class="stat"><div class="num" id="statTotalSets">0</div><div class="label">סטים בכל הזמנים</div></div>
      <div class="stat"><div class="num" id="statTotalReps">0</div><div class="label">חזרות בכל הזמנים</div></div>
      <div class="stat"><div class="num" id="statRecord">0</div><div class="label">שיא אישי</div></div>
    </div>
  </div>

</main>

<div class="toast" id="toast">נשמר!</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "sportapp_sets_v1";
  const COUNTER_KEY = "sportapp_last_counter_v1";
  const EXERCISE = "pullups";

  function loadSets(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveSets(sets){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sets));
  }

  let sets = loadSets();
  let counter = parseInt(localStorage.getItem(COUNTER_KEY), 10) || 8;

  const counterVal = document.getElementById("counterVal");
  const minusBtn = document.getElementById("minusBtn");
  const plusBtn = document.getElementById("plusBtn");
  const addBtn = document.getElementById("addBtn");
  const quickChips = document.getElementById("quickChips");
  const setsList = document.getElementById("setsList");
  const toast = document.getElementById("toast");
  const todayLabel = document.getElementById("todayLabel");

  function fmtDate(d){
    return d.toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
  }
  todayLabel.textContent = fmtDate(new Date());

  function dayKey(ts){
    const d = new Date(ts);
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }
  const todayKey = dayKey(Date.now());

  function renderCounter(){
    counterVal.textContent = counter;
    localStorage.setItem(COUNTER_KEY, String(counter));
  }

  function renderQuickChips(){
    const vals = Array.from(new Set([5,8,10,12,15])).sort((a,b)=>a-b);
    quickChips.innerHTML = "";
    vals.forEach(v=>{
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = v;
      b.addEventListener("click", ()=>{ counter = v; renderCounter(); });
      quickChips.appendChild(b);
    });
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=> toast.classList.remove("show"), 1200);
  }

  function todaysSets(){
    return sets.filter(s => s.exercise === EXERCISE && dayKey(s.ts) === todayKey)
                .sort((a,b)=> b.ts - a.ts);
  }

  function renderStats(){
    const today = todaysSets();
    const totalRepsToday = today.reduce((s,x)=> s + x.reps, 0);
    const bestToday = today.reduce((m,x)=> Math.max(m, x.reps), 0);

    document.getElementById("statSets").textContent = today.length;
    document.getElementById("statReps").textContent = totalRepsToday;
    document.getElementById("statBest").textContent = bestToday;

    const all = sets.filter(s => s.exercise === EXERCISE);
    const totalReps = all.reduce((s,x)=> s + x.reps, 0);
    const record = all.reduce((m,x)=> Math.max(m, x.reps), 0);
    document.getElementById("statTotalSets").textContent = all.length;
    document.getElementById("statTotalReps").textContent = totalReps;
    document.getElementById("statRecord").textContent = record;
  }

  function renderSetsList(){
    const today = todaysSets();
    setsList.innerHTML = "";
    if(today.length === 0){
      setsList.innerHTML = '<div class="empty">עוד לא עשית סטים היום — קדימה! 💪</div>';
      return;
    }
    today.forEach(s=>{
      const row = document.createElement("div");
      row.className = "set-row";
      const time = new Date(s.ts).toLocaleTimeString("he-IL", {hour:"2-digit", minute:"2-digit"});
      row.innerHTML = `
        <div class="left">
          <span class="badge">${s.reps}</span>
          <span class="time">${time}</span>
        </div>
        <button class="del" data-id="${s.id}">✕</button>
      `;
      setsList.appendChild(row);
    });
    setsList.querySelectorAll(".del").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-id");
        sets = sets.filter(s => String(s.id) !== id);
        saveSets(sets);
        renderAll();
      });
    });
  }

  function renderChart(){
    const canvas = document.getElementById("weekChart");
    const labelsEl = document.getElementById("chartLabels");
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.parentElement.clientWidth - 36;
    const cssHeight = 140;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.direction = "ltr";

    const days = [];
    for(let i=6; i>=0; i--){
      const d = new Date();
      d.setDate(d.getDate() - i);
      d.setHours(0,0,0,0);
      days.push(d);
    }
    const totals = days.map(d=>{
      const key = dayKey(d.getTime());
      return sets.filter(s => s.exercise === EXERCISE && dayKey(s.ts) === key)
                  .reduce((sum,x)=> sum + x.reps, 0);
    });
    const max = Math.max(1, ...totals);

    ctx.clearRect(0,0,cssWidth,cssHeight);
    const barCount = totals.length;
    const gap = 10;
    const barWidth = (cssWidth - gap*(barCount-1)) / barCount;
    const chartTop = 8, chartBottom = cssHeight - 8;
    const usableH = chartBottom - chartTop;

    totals.forEach((val, i)=>{
      const h = Math.max(4, (val / max) * usableH);
      const x = i * (barWidth + gap);
      const y = chartBottom - h;
      const grad = ctx.createLinearGradient(0, y, 0, chartBottom);
      grad.addColorStop(0, "#22d3ee");
      grad.addColorStop(1, "#818cf8");
      ctx.fillStyle = grad;
      const r = 6;
      ctx.beginPath();
      ctx.moveTo(x, y+r);
      ctx.arcTo(x, y, x+r, y, r);
      ctx.arcTo(x+barWidth, y, x+barWidth, y+r, r);
      ctx.lineTo(x+barWidth, chartBottom);
      ctx.lineTo(x, chartBottom);
      ctx.closePath();
      ctx.fill();

      if(val > 0){
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "700 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(val, x + barWidth/2, y - 4);
      }
    });

    labelsEl.innerHTML = "";
    days.forEach(d=>{
      const span = document.createElement("span");
      span.style.width = (barWidth) + "px";
      span.style.textAlign = "center";
      span.textContent = d.toLocaleDateString("he-IL", {weekday:"short"});
      labelsEl.appendChild(span);
    });
  }

  function renderAll(){
    renderStats();
    renderSetsList();
    renderChart();
  }

  minusBtn.addEventListener("click", ()=>{
    counter = Math.max(0, counter - 1);
    renderCounter();
  });
  plusBtn.addEventListener("click", ()=>{
    counter = Math.min(200, counter + 1);
    renderCounter();
  });

  addBtn.addEventListener("click", ()=>{
    if(counter <= 0) return;
    sets.push({ id: Date.now() + "_" + Math.random().toString(36).slice(2), exercise: EXERCISE, reps: counter, ts: Date.now() });
    saveSets(sets);
    showToast("סט נשמר: " + counter + " חזרות 💪");
    renderAll();
  });

  window.addEventListener("resize", renderChart);

  renderCounter();
  renderQuickChips();
  renderAll();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>

</body>
</html>

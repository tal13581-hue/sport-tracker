<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>מעקב ספורט</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#243247;
    --accent:#22d3ee;
    --accent2:#818cf8;
    --pink:#f472b6;
    --purple:#a78bfa;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --good:#34d399;
    --danger:#f87171;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior-y:contain;}
  body{padding-bottom:40px;min-height:100vh;}

  header{padding:22px 20px 10px;display:flex;align-items:center;gap:12px;}
  header h1{font-size:20px;margin:0;font-weight:700;flex:1;}
  header .date{font-size:13px;color:var(--muted);margin-top:2px;}
  .back-btn{background:var(--card);border:none;color:var(--text);font-size:20px;
    width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .back-btn:active{background:var(--card2);}

  main{padding:0 16px;display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* ===== Home tiles ===== */
  .tiles{display:flex;flex-direction:column;gap:16px;padding:8px 16px;max-width:480px;margin:0 auto;}
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .tile{border:none;width:100%;border-radius:26px;cursor:pointer;text-align:center;
    transition:transform .1s ease;padding:0;color:inherit;font-family:inherit;}
  .tile:active{transform:scale(.97);}

  .tile-exercise{
    background:linear-gradient(150deg,var(--accent) 0%,var(--accent2) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    box-shadow:0 10px 30px rgba(34,211,238,.28);
    position:relative;overflow:hidden;
  }
  .tile-exercise .tile-name{font-weight:900;color:#0b1220;letter-spacing:.5px;}
  .tile-exercise .tile-sub{font-size:13px;font-weight:600;color:rgba(11,18,32,.65);}

  .tile-hero{aspect-ratio:1.35;}
  .tile-hero svg{width:36%;height:auto;}
  .tile-hero .tile-name{font-size:40px;}

  .tile-small{aspect-ratio:.95;padding:8px;}
  .tile-small svg{width:52%;height:auto;}
  .tile-small .tile-name{font-size:22px;}
  .tile-small .tile-sub{font-size:11px;}

  .tile-wide{aspect-ratio:2.6;flex-direction:row;gap:18px;padding:0 10px;}
  .tile-wide svg{width:17%;height:auto;}
  .tile-wide .tile-name{font-size:26px;}
  .tile-wide .tile-text{display:flex;flex-direction:column;align-items:flex-start;gap:3px;}

  .tile-stats{
    aspect-ratio:2.3;
    background:rgba(167,139,250,.08);
    border:3px solid transparent;
    background-clip:padding-box;
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  }
  .tile-stats::before{
    content:"";position:absolute;inset:-3px;border-radius:26px;z-index:-1;
    background:linear-gradient(135deg,var(--pink),var(--purple),var(--pink));
  }
  .tile-stats .tile-name{
    font-size:32px;font-weight:900;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tile-stats .tile-sub{font-size:13px;color:var(--muted);}
  .tile-stats .mini-bars{display:flex;align-items:flex-end;gap:5px;height:30px;}
  .tile-stats .mini-bars span{width:9px;border-radius:3px;background:linear-gradient(180deg,var(--pink),var(--purple));opacity:.85;}

  /* ===== Cards ===== */
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.25);margin-bottom:16px;}
  .card-title{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .card-title .emoji{font-size:20px;}

  .counter-row{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:16px;}
  .counter-btn{width:56px;height:56px;border-radius:50%;border:none;
    background:var(--card2);color:var(--text);font-size:26px;font-weight:700;
    display:flex;align-items:center;justify-content:center;transition:transform .08s ease;}
  .counter-btn:active{transform:scale(.9);background:#2f3f59;}
  .counter-value{font-size:46px;font-weight:800;min-width:120px;text-align:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .quick-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:8px 14px;border-radius:999px;background:var(--card2);color:var(--muted);
    font-size:14px;border:none;font-weight:600;font-family:inherit;}
  .chip:active{background:#2f3f59;color:var(--text);}
  .chip.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;}

  .level-wrap{margin-bottom:16px;}
  .level-label{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px;}
  .level-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .level-chips .chip{padding:7px 0;width:36px;text-align:center;}

  .add-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1220;
    box-shadow:0 6px 16px rgba(34,211,238,.25);font-family:inherit;}
  .add-btn:active{transform:scale(.98);}

  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat{background:var(--card2);border-radius:14px;padding:12px 6px;text-align:center;}
  .stat .num{font-size:21px;font-weight:800;color:var(--accent);}
  .stat.alt .num{color:var(--purple);}
  .stat .label{font-size:11px;color:var(--muted);margin-top:2px;}

  .sets-list{display:flex;flex-direction:column;gap:8px;}
  .set-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--card2);border-radius:12px;padding:10px 14px;}
  .set-row .left{display:flex;align-items:center;gap:10px;}
  .set-row .badge{background:var(--accent);color:#0b1220;font-weight:800;font-size:14px;
    border-radius:8px;padding:4px 10px;min-width:34px;text-align:center;white-space:nowrap;}
  .set-row .lvl{font-size:11px;color:var(--muted);background:var(--card);border-radius:6px;padding:3px 7px;}
  .set-row .time{color:var(--muted);font-size:12px;}
  .set-row .del{background:none;border:none;color:var(--danger);font-size:18px;padding:4px 8px;}
  .set-row .ex-emoji{font-size:16px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}

  canvas{width:100%;display:block;}

  /* goal */
  .goal-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .goal-row input{width:70px;padding:8px;border-radius:10px;border:none;background:var(--card2);
    color:var(--text);font-size:16px;font-weight:700;text-align:center;font-family:inherit;}
  .goal-row label{font-size:14px;color:var(--muted);}
  .progress-wrap{background:var(--card2);border-radius:999px;height:16px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--purple));
    transition:width .4s ease;min-width:0;}
  .progress-text{font-size:12px;color:var(--muted);margin-top:6px;text-align:center;}

  /* trend */
  .trend-box{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 2px;}
  .trend-arrow{font-size:34px;}
  .trend-pct{font-size:28px;font-weight:900;}
  .trend-pct.up{color:var(--good);}
  .trend-pct.down{color:var(--danger);}
  .trend-desc{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;}

  /* per-exercise summary */
  .ex-row{display:flex;align-items:center;gap:10px;background:var(--card2);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .ex-row .ex-name{font-size:13px;font-weight:700;flex:1;display:flex;align-items:center;gap:7px;}
  .ex-row .ex-cell{text-align:center;min-width:56px;}
  .ex-row .ex-cell b{display:block;font-size:14px;color:var(--purple);}
  .ex-row .ex-cell span{font-size:10px;color:var(--muted);}

  /* history */
  .day-row{background:var(--card2);border-radius:14px;margin-bottom:8px;overflow:hidden;}
  .day-head{display:flex;align-items:center;padding:12px 14px;gap:10px;cursor:pointer;}
  .day-head .d-date{font-weight:700;font-size:14px;flex:1;}
  .day-head .d-info{font-size:12px;color:var(--muted);}
  .day-head .d-total{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;
    font-weight:800;font-size:13px;border-radius:8px;padding:4px 10px;white-space:nowrap;}
  .day-head .d-trash{background:none;border:none;color:var(--danger);font-size:16px;padding:2px 6px;}
  .day-body{display:none;padding:0 14px 12px;}
  .day-row.open .day-body{display:block;}
  .day-body .set-row{background:var(--card);margin-bottom:6px;}

  .danger-btn{width:100%;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:700;
    background:rgba(248,113,113,.12);color:var(--danger);border:1px solid rgba(248,113,113,.35);font-family:inherit;}
  .danger-btn:active{background:rgba(248,113,113,.25);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--good);color:#052e19;font-weight:700;padding:10px 20px;border-radius:999px;
    font-size:14px;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="screen active" id="screen-home">
  <header>
    <div>
      <h1>💪 מעקב ספורט</h1>
      <div class="date" id="todayLabel"></div>
    </div>
  </header>
  <div class="tiles">

    <button class="tile tile-exercise tile-hero" data-ex="pullups">
      <svg viewBox="0 0 180 150" fill="none" stroke="#0b1220" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="22" x2="162" y2="22"/>
        <line x1="24" y1="22" x2="24" y2="145"/>
        <line x1="156" y1="22" x2="156" y2="145"/>
        <circle cx="90" cy="52" r="12" fill="#0b1220"/>
        <line x1="90" y1="64" x2="90" y2="100"/>
        <polyline points="90,68 70,48 63,24"/>
        <polyline points="90,68 110,48 117,24"/>
        <polyline points="90,100 78,118 88,132"/>
        <polyline points="90,100 102,118 92,130"/>
      </svg>
      <span class="tile-name">מתח</span>
      <span class="tile-sub" data-ex-sub="pullups"></span>
    </button>

    <div class="tile-grid">
      <button class="tile tile-exercise tile-small" data-ex="hang">
        <svg viewBox="0 0 180 170" fill="none" stroke="#0b1220" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="162" y2="20"/>
          <circle cx="90" cy="72" r="12" fill="#0b1220"/>
          <line x1="90" y1="84" x2="90" y2="122"/>
          <line x1="90" y1="88" x2="68" y2="24"/>
          <line x1="90" y1="88" x2="112" y2="24"/>
          <line x1="90" y1="122" x2="82" y2="158"/>
          <line x1="90" y1="122" x2="98" y2="158"/>
        </svg>
        <span class="tile-name">תליה פסיבית</span>
        <span class="tile-sub" data-ex-sub="hang"></span>
      </button>

      <button class="tile tile-exercise tile-small" data-ex="abs">
        <svg viewBox="0 0 180 170" fill="none" stroke="#0b1220" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <line x1="14" y1="150" x2="166" y2="150"/>
          <circle cx="52" cy="86" r="12" fill="#0b1220"/>
          <polyline points="60,96 88,118 118,118"/>
          <polyline points="118,118 136,92 130,148"/>
          <polyline points="60,100 78,80 92,92"/>
        </svg>
        <span class="tile-name">בטן</span>
        <span class="tile-sub" data-ex-sub="abs"></span>
      </button>
    </div>

    <button class="tile tile-exercise tile-wide" data-ex="handstand">
      <svg viewBox="0 0 130 170" fill="none" stroke="#0b1220" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <line x1="14" y1="158" x2="116" y2="158"/>
        <circle cx="65" cy="128" r="12" fill="#0b1220"/>
        <line x1="65" y1="116" x2="65" y2="66"/>
        <line x1="65" y1="112" x2="44" y2="158"/>
        <line x1="65" y1="112" x2="86" y2="158"/>
        <polyline points="65,66 52,34 60,10"/>
        <polyline points="65,66 80,38 74,12"/>
      </svg>
      <div class="tile-text">
        <span class="tile-name">עמידת ידיים</span>
        <span class="tile-sub" data-ex-sub="handstand"></span>
      </div>
    </button>

    <button class="tile tile-stats" id="tileStats">
      <div class="mini-bars"><span style="height:30%"></span><span style="height:55%"></span><span style="height:40%"></span><span style="height:75%"></span><span style="height:60%"></span><span style="height:100%"></span></div>
      <span class="tile-name">סטטיסטיקה</span>
      <span class="tile-sub">היסטוריה · מגמות · יעדים</span>
    </button>

  </div>
</div>

<!-- ============ GENERIC LOG SCREEN ============ -->
<div class="screen" id="screen-log">
  <header>
    <button class="back-btn" data-back>→</button>
    <div>
      <h1 id="logTitle"></h1>
      <div class="date" id="logDateLabel"></div>
    </div>
  </header>
  <main>
    <div class="card">
      <p class="card-title"><span class="emoji">✏️</span> <span id="logQuestion"></span></p>
      <div class="counter-row">
        <button class="counter-btn" id="minusBtn">−</button>
        <div class="counter-value" id="counterVal"></div>
        <button class="counter-btn" id="plusBtn">+</button>
      </div>
      <div class="quick-chips" id="quickChips"></div>
      <div class="level-wrap" id="levelWrap" style="display:none">
        <div class="level-label">רמת קושי (1–10)</div>
        <div class="level-chips" id="levelChips"></div>
      </div>
      <button class="add-btn" id="addBtn">✅ הוסף סט</button>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">📊</span> היום</p>
      <div class="stats-grid">
        <div class="stat"><div class="num" id="statSets">0</div><div class="label">סטים</div></div>
        <div class="stat"><div class="num" id="statTotal">0</div><div class="label" id="statTotalLabel">סה"כ</div></div>
        <div class="stat"><div class="num" id="statBest">0</div><div class="label">הכי טוב</div></div>
      </div>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">📝</span> סטים של היום</p>
      <div class="sets-list" id="setsList"></div>
    </div>
  </main>
</div>

<!-- ============ STATS ============ -->
<div class="screen" id="screen-stats">
  <header>
    <button class="back-btn" data-back>→</button>
    <div><h1>📊 סטטיסטיקה</h1></div>
  </header>
  <main>

    <div class="card">
      <p class="card-title"><span class="emoji">🏆</span> סיכום</p>
      <div class="stats-grid">
        <div class="stat alt"><div class="num" id="sStreak">0</div><div class="label">ימים ברצף</div></div>
        <div class="stat alt"><div class="num" id="sAvgPull">0</div><div class="label">ממוצע מתח יומי</div></div>
        <div class="stat alt"><div class="num" id="sAvgSets">0</div><div class="label">ממוצע סטים יומי</div></div>
      </div>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">🎯</span> יעד יומי — מתח</p>
      <div class="goal-row">
        <label>היעד שלי:</label>
        <input type="number" id="goalInput" min="1" max="1000" inputmode="numeric">
        <label>חזרות ביום</label>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="goalBar" style="width:0%"></div></div>
      <div class="progress-text" id="goalText"></div>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">📈</span> מגמת שיפור — מתח</p>
      <div class="trend-box">
        <span class="trend-arrow" id="trendArrow"></span>
        <span class="trend-pct" id="trendPct"></span>
      </div>
      <div class="trend-desc" id="trendDesc"></div>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">📅</span> חזרות מתח לפי יום</p>
      <canvas id="dailyChart" height="170" dir="ltr"></canvas>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">🤸</span> תרגילים נוספים</p>
      <div id="exSummary"></div>
    </div>

    <div class="card">
      <p class="card-title"><span class="emoji">📚</span> היסטוריית אימונים</p>
      <div id="historyList"></div>
    </div>

    <button class="danger-btn" id="wipeBtn">🗑️ מחיקת כל הנתונים</button>

  </main>
</div>

<div class="toast" id="toast">נשמר!</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "sportapp_sets_v1";
  const GOAL_KEY = "sportapp_goal_v1";
  const LEVEL_KEY = "sportapp_level_v1";

  function fmtSecs(v){
    const m = Math.floor(v/60), s = v%60;
    if(m === 0) return s + " שנ׳";
    return m + ":" + String(s).padStart(2,"0");
  }

  const EXERCISES = {
    pullups:   { name:"מתח", emoji:"🧗", unit:"חזרות", step:1, min:0, max:500, def:8,
                 chips:[5,8,10,12,15], fmt:v=>String(v), hasLevel:false },
    hang:      { name:"תליה פסיבית", emoji:"🪢", unit:"שניות", step:10, min:0, max:900, def:50,
                 chips:[30,50,60,70,90], fmt:fmtSecs, hasLevel:false },
    abs:       { name:"בטן", emoji:"🔥", unit:"דקות", step:1, min:0, max:180, def:4,
                 chips:[3,4,5,6,8], fmt:v=>v+" דק׳", hasLevel:false },
    handstand: { name:"עמידת ידיים", emoji:"🤸", unit:"שניות", step:5, min:0, max:600, def:20,
                 chips:[10,15,20,30,45], fmt:fmtSecs, hasLevel:true }
  };

  /* ---------- data ---------- */
  function loadSets(){
    try{
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      return raw.map(s => s.val === undefined ? Object.assign({}, s, {val: s.reps || 0}) : s);
    }catch(e){ return []; }
  }
  function saveSets(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(sets)); }

  let sets = loadSets();
  let goal = parseInt(localStorage.getItem(GOAL_KEY), 10) || 50;
  let level = parseInt(localStorage.getItem(LEVEL_KEY), 10) || 5;
  let currentEx = "pullups";
  const counters = {};
  Object.keys(EXERCISES).forEach(k=>{
    const v = parseInt(localStorage.getItem("sportapp_counter_" + k), 10);
    counters[k] = (v >= 0 ? v : EXERCISES[k].def) || EXERCISES[k].def;
  });
  const openDays = new Set();

  /* ---------- helpers ---------- */
  function dayKey(ts){
    const d = new Date(ts);
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }
  function startOfDay(offsetDays){
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + offsetDays);
    return d;
  }
  function exSets(ex){ return sets.filter(s => s.exercise === ex); }
  function totalForKey(ex, key){
    return exSets(ex).filter(s => dayKey(s.ts) === key).reduce((sum,x)=> sum + x.val, 0);
  }
  function todaysSets(ex){
    const tk = dayKey(Date.now());
    return exSets(ex).filter(s => dayKey(s.ts) === tk).sort((a,b)=> b.ts - a.ts);
  }
  function fmtDate(d){
    return d.toLocaleDateString("he-IL", { weekday:"long", day:"numeric", month:"long" });
  }

  /* ---------- navigation ---------- */
  const screens = {
    home: document.getElementById("screen-home"),
    log: document.getElementById("screen-log"),
    stats: document.getElementById("screen-stats")
  };
  function route(){
    const h = (location.hash || "").replace("#","");
    let name = "home";
    if(h === "stats") name = "stats";
    else if(h.startsWith("log/")){
      const ex = h.slice(4);
      if(EXERCISES[ex]){ name = "log"; currentEx = ex; }
    }
    else if(h === "pullups"){ name = "log"; currentEx = "pullups"; }
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
    window.scrollTo(0,0);
    if(name === "home") renderHome();
    if(name === "log") renderLog();
    if(name === "stats") renderStats();
  }
  window.addEventListener("hashchange", route);
  document.querySelectorAll("[data-ex]").forEach(t =>
    t.addEventListener("click", ()=> location.hash = "log/" + t.getAttribute("data-ex")));
  document.getElementById("tileStats").addEventListener("click", ()=> location.hash = "stats");
  document.querySelectorAll("[data-back]").forEach(b =>
    b.addEventListener("click", ()=> { location.hash = ""; }));

  /* ---------- toast ---------- */
  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove("show"), 1300);
  }

  /* ---------- HOME ---------- */
  function renderHome(){
    document.getElementById("todayLabel").textContent = fmtDate(new Date());
    Object.keys(EXERCISES).forEach(ex=>{
      const el = document.querySelector('[data-ex-sub="' + ex + '"]');
      if(!el) return;
      const t = todaysSets(ex);
      if(t.length === 0){
        el.textContent = ex === "pullups" ? "לחץ כדי להתחיל 🚀" : "עוד לא היום";
        return;
      }
      const total = t.reduce((s,x)=> s + x.val, 0);
      el.textContent = "היום: " + t.length + " סטים · " + EXERCISES[ex].fmt(total);
    });
  }

  /* ---------- LOG SCREEN ---------- */
  const counterVal = document.getElementById("counterVal");

  function cfg(){ return EXERCISES[currentEx]; }

  function renderCounter(){
    counterVal.textContent = cfg().fmt(counters[currentEx]);
    localStorage.setItem("sportapp_counter_" + currentEx, String(counters[currentEx]));
  }
  document.getElementById("minusBtn").addEventListener("click", ()=>{
    counters[currentEx] = Math.max(cfg().min, counters[currentEx] - cfg().step);
    renderCounter();
  });
  document.getElementById("plusBtn").addEventListener("click", ()=>{
    counters[currentEx] = Math.min(cfg().max, counters[currentEx] + cfg().step);
    renderCounter();
  });

  function buildChips(){
    const qc = document.getElementById("quickChips");
    qc.innerHTML = "";
    cfg().chips.forEach(v=>{
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = cfg().fmt(v);
      b.addEventListener("click", ()=>{ counters[currentEx] = v; renderCounter(); });
      qc.appendChild(b);
    });
  }

  function buildLevels(){
    const wrap = document.getElementById("levelWrap");
    if(!cfg().hasLevel){ wrap.style.display = "none"; return; }
    wrap.style.display = "";
    const lc = document.getElementById("levelChips");
    lc.innerHTML = "";
    for(let i=1; i<=10; i++){
      const b = document.createElement("button");
      b.className = "chip" + (i === level ? " sel" : "");
      b.textContent = i;
      b.addEventListener("click", ()=>{
        level = i;
        localStorage.setItem(LEVEL_KEY, String(level));
        buildLevels();
      });
      lc.appendChild(b);
    }
  }

  document.getElementById("addBtn").addEventListener("click", ()=>{
    const v = counters[currentEx];
    if(v <= 0) return;
    const entry = { id: Date.now() + "_" + Math.random().toString(36).slice(2),
                    exercise: currentEx, val: v, ts: Date.now() };
    if(cfg().hasLevel) entry.level = level;
    sets.push(entry);
    saveSets();
    showToast("סט נשמר: " + cfg().fmt(v) + " " + cfg().emoji);
    renderLog();
  });

  function renderLog(){
    const c = cfg();
    document.getElementById("logTitle").textContent = c.emoji + " " + c.name;
    document.getElementById("logDateLabel").textContent = fmtDate(new Date());
    document.getElementById("logQuestion").textContent =
      c.unit === "חזרות" ? "כמה חזרות עשית?" :
      c.unit === "דקות" ? "כמה דקות עשית?" : "כמה שניות החזקת?";
    document.getElementById("statTotalLabel").textContent = 'סה"כ ' + c.unit;
    buildChips();
    buildLevels();
    renderCounter();

    const today = todaysSets(currentEx);
    const total = today.reduce((s,x)=> s + x.val, 0);
    const best = today.reduce((m,x)=> Math.max(m, x.val), 0);
    document.getElementById("statSets").textContent = today.length;
    document.getElementById("statTotal").textContent = c.fmt(total);
    document.getElementById("statBest").textContent = today.length ? c.fmt(best) : 0;

    const list = document.getElementById("setsList");
    list.innerHTML = "";
    if(today.length === 0){
      list.innerHTML = '<div class="empty">עוד לא עשית סטים היום — קדימה! 💪</div>';
      return;
    }
    today.forEach(s=>{
      const row = document.createElement("div");
      row.className = "set-row";
      const time = new Date(s.ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
      row.innerHTML = '<div class="left"><span class="badge">' + c.fmt(s.val) + '</span>' +
        (s.level ? '<span class="lvl">רמה ' + s.level + '</span>' : '') +
        '<span class="time">' + time + '</span></div>' +
        '<button class="del" data-id="' + s.id + '">✕</button>';
      list.appendChild(row);
    });
    list.querySelectorAll(".del").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        sets = sets.filter(s => String(s.id) !== btn.getAttribute("data-id"));
        saveSets(); renderLog();
      });
    });
  }

  /* ---------- STATS ---------- */
  const goalInput = document.getElementById("goalInput");
  goalInput.addEventListener("change", ()=>{
    const v = parseInt(goalInput.value, 10);
    if(v >= 1 && v <= 1000){ goal = v; localStorage.setItem(GOAL_KEY, String(goal)); }
    renderGoal();
  });

  function renderGoal(){
    goalInput.value = goal;
    const reps = totalForKey("pullups", dayKey(Date.now()));
    const pct = Math.min(100, Math.round(reps / goal * 100));
    document.getElementById("goalBar").style.width = pct + "%";
    document.getElementById("goalText").textContent =
      reps >= goal ? "🎉 עמדת ביעד! " + reps + "/" + goal + " חזרות היום"
                   : reps + "/" + goal + " חזרות היום (" + pct + "%)";
  }

  function anyForKey(key){
    return sets.some(s => dayKey(s.ts) === key);
  }
  function computeStreak(){
    let streak = 0;
    let offset = anyForKey(dayKey(startOfDay(0).getTime())) ? 0 : -1;
    while(true){
      const key = dayKey(startOfDay(offset - streak).getTime());
      if(anyForKey(key)) streak++;
      else break;
    }
    return streak;
  }

  function renderSummary(){
    document.getElementById("sStreak").textContent = computeStreak();

    const pull = exSets("pullups");
    const pullDays = new Set(pull.map(s => dayKey(s.ts)));
    const pullReps = pull.reduce((s,x)=> s + x.val, 0);
    document.getElementById("sAvgPull").textContent =
      pullDays.size ? Math.round(pullReps / pullDays.size) : 0;

    const allDays = new Set(sets.map(s => dayKey(s.ts)));
    const avgSets = allDays.size ? sets.length / allDays.size : 0;
    document.getElementById("sAvgSets").textContent =
      avgSets ? (Math.round(avgSets * 10) / 10) : 0;
  }

  function renderTrend(){
    const last7 = [], prev7 = [];
    for(let i=6;i>=0;i--) last7.push(totalForKey("pullups", dayKey(startOfDay(-i).getTime())));
    for(let i=13;i>=7;i--) prev7.push(totalForKey("pullups", dayKey(startOfDay(-i).getTime())));
    const sum = a => a.reduce((x,y)=>x+y,0);
    const s1 = sum(prev7), s2 = sum(last7);
    const arrow = document.getElementById("trendArrow");
    const pctEl = document.getElementById("trendPct");
    const desc = document.getElementById("trendDesc");
    if(s1 === 0 && s2 === 0){
      arrow.textContent = "📭"; pctEl.textContent = ""; pctEl.className = "trend-pct";
      desc.textContent = "אין עדיין מספיק נתונים — תתחיל להתאמן ותראה כאן מגמות";
      return;
    }
    if(s1 === 0){
      arrow.textContent = "🚀"; pctEl.textContent = "התחלה חדשה"; pctEl.className = "trend-pct up";
      desc.textContent = "השבוע: " + s2 + " חזרות · שבוע שעבר: 0";
      return;
    }
    const pct = Math.round((s2 - s1) / s1 * 100);
    if(pct >= 0){
      arrow.textContent = "📈"; pctEl.textContent = "+" + pct + "%"; pctEl.className = "trend-pct up";
    } else {
      arrow.textContent = "📉"; pctEl.textContent = pct + "%"; pctEl.className = "trend-pct down";
    }
    desc.textContent = "השבוע: " + s2 + " חזרות · שבוע שעבר: " + s1;
  }

  function setupCanvas(canvas, cssHeight){
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.parentElement.clientWidth - 36;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.direction = "ltr";
    return { ctx, w: cssWidth, h: cssHeight };
  }

  function renderDailyChart(){
    const canvas = document.getElementById("dailyChart");
    const { ctx, w, h } = setupCanvas(canvas, 170);
    const pull = exSets("pullups");

    let firstTs = Date.now();
    pull.forEach(s => { if(s.ts < firstTs) firstTs = s.ts; });
    const first = new Date(firstTs); first.setHours(0,0,0,0);
    const today = startOfDay(0);
    let nDays = Math.round((today - first) / 86400000) + 1;
    if(nDays < 7) nDays = 7;
    if(nDays > 60) nDays = 60;

    const days = [], totals = [];
    for(let i = nDays - 1; i >= 0; i--){
      const d = startOfDay(-i);
      days.push(d);
      totals.push(totalForKey("pullups", dayKey(d.getTime())));
    }
    const max = Math.max(1, ...totals);

    const top = 20, bottom = h - 26;
    ctx.clearRect(0,0,w,h);

    // baseline
    ctx.strokeStyle = "rgba(148,163,184,.25)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, bottom); ctx.lineTo(w, bottom); ctx.stroke();

    const step = totals.length > 1 ? w / (totals.length - 1) : w;
    const pts = totals.map((v,i)=> [i*step, bottom - (v/max)*(bottom-top)]);

    // area
    ctx.beginPath();
    ctx.moveTo(pts[0][0], bottom);
    pts.forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.lineTo(pts[pts.length-1][0], bottom);
    ctx.closePath();
    const fillGrad = ctx.createLinearGradient(0, top, 0, bottom);
    fillGrad.addColorStop(0, "rgba(34,211,238,.30)");
    fillGrad.addColorStop(1, "rgba(129,140,248,0)");
    ctx.fillStyle = fillGrad;
    ctx.fill();

    // line
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
    const lineGrad = ctx.createLinearGradient(0,0,w,0);
    lineGrad.addColorStop(0, "#22d3ee"); lineGrad.addColorStop(1, "#818cf8");
    ctx.strokeStyle = lineGrad;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.stroke();

    // dots + value labels when few days
    if(totals.length <= 14){
      pts.forEach((p,i)=>{
        ctx.beginPath();
        ctx.arc(p[0], p[1], 3.5, 0, Math.PI*2);
        ctx.fillStyle = "#22d3ee";
        ctx.fill();
        if(totals[i] > 0){
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "700 12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(totals[i], p[0], p[1] - 9);
        }
      });
    }

    // x-axis date labels (~4)
    ctx.fillStyle = "#94a3b8";
    ctx.font = "600 10px sans-serif";
    const tickCount = Math.min(4, totals.length);
    for(let t=0; t<tickCount; t++){
      const idx = tickCount === 1 ? 0 : Math.round(t * (totals.length-1) / (tickCount-1));
      const d = days[idx];
      const label = d.getDate() + "." + (d.getMonth()+1);
      ctx.textAlign = t === 0 ? "left" : (t === tickCount-1 ? "right" : "center");
      ctx.fillText(label, pts[idx][0], h - 8);
    }
  }

  function renderExSummary(){
    const wrap = document.getElementById("exSummary");
    wrap.innerHTML = "";
    const weekAgo = startOfDay(-6).getTime();
    ["hang","abs","handstand"].forEach(ex=>{
      const c = EXERCISES[ex];
      const all = exSets(ex);
      const week = all.filter(s => s.ts >= weekAgo).reduce((s,x)=> s + x.val, 0);
      const record = all.reduce((m,x)=> Math.max(m, x.val), 0);
      const row = document.createElement("div");
      row.className = "ex-row";
      row.innerHTML =
        '<span class="ex-name">' + c.emoji + ' ' + c.name + '</span>' +
        '<span class="ex-cell"><b>' + all.length + '</b><span>סטים</span></span>' +
        '<span class="ex-cell"><b>' + (week ? c.fmt(week) : "—") + '</b><span>השבוע</span></span>' +
        '<span class="ex-cell"><b>' + (record ? c.fmt(record) : "—") + '</b><span>שיא</span></span>';
      wrap.appendChild(row);
    });
  }

  function renderHistory(){
    const wrap = document.getElementById("historyList");
    wrap.innerHTML = "";
    const byDay = {};
    sets.forEach(s=>{
      const k = dayKey(s.ts);
      (byDay[k] = byDay[k] || []).push(s);
    });
    const keys = Object.keys(byDay).sort((a,b)=> byDay[b][0].ts - byDay[a][0].ts);
    if(keys.length === 0){
      wrap.innerHTML = '<div class="empty">אין עדיין נתונים — ההיסטוריה תופיע כאן</div>';
      return;
    }
    keys.forEach(k=>{
      const daySets = byDay[k].sort((a,b)=> b.ts - a.ts);
      const d = new Date(daySets[0].ts);
      const pullTotal = daySets.filter(s=>s.exercise==="pullups").reduce((s,x)=> s + x.val, 0);
      const row = document.createElement("div");
      row.className = "day-row" + (openDays.has(k) ? " open" : "");
      row.innerHTML =
        '<div class="day-head">' +
        '<span class="d-date">' + d.toLocaleDateString("he-IL",{weekday:"short", day:"numeric", month:"numeric"}) + '</span>' +
        '<span class="d-info">' + daySets.length + ' סטים</span>' +
        (pullTotal ? '<span class="d-total">מתח ' + pullTotal + '</span>' : '') +
        '<button class="d-trash" title="מחק יום">🗑️</button>' +
        '</div><div class="day-body"></div>';
      const body = row.querySelector(".day-body");
      daySets.forEach(s=>{
        const c = EXERCISES[s.exercise] || EXERCISES.pullups;
        const time = new Date(s.ts).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
        const sr = document.createElement("div");
        sr.className = "set-row";
        sr.innerHTML = '<div class="left"><span class="ex-emoji">' + c.emoji + '</span>' +
          '<span class="badge">' + c.fmt(s.val) + '</span>' +
          (s.level ? '<span class="lvl">רמה ' + s.level + '</span>' : '') +
          '<span class="time">' + time + '</span></div>' +
          '<button class="del" data-id="' + s.id + '">✕</button>';
        body.appendChild(sr);
      });
      row.querySelector(".day-head").addEventListener("click", (e)=>{
        if(e.target.classList.contains("d-trash")) return;
        row.classList.toggle("open");
        if(row.classList.contains("open")) openDays.add(k); else openDays.delete(k);
      });
      row.querySelector(".d-trash").addEventListener("click", ()=>{
        if(!confirm("למחוק את כל הסטים של יום זה?")) return;
        sets = sets.filter(s => dayKey(s.ts) !== k);
        saveSets(); renderStats();
      });
      body.querySelectorAll(".del").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          sets = sets.filter(s => String(s.id) !== btn.getAttribute("data-id"));
          saveSets(); renderStats();
        });
      });
      wrap.appendChild(row);
    });
  }

  document.getElementById("wipeBtn").addEventListener("click", ()=>{
    if(!confirm("למחוק את כל הנתונים? אי אפשר לשחזר!")) return;
    if(!confirm("בטוח בטוח? הכל יימחק לצמיתות")) return;
    sets = [];
    saveSets();
    showToast("כל הנתונים נמחקו");
    renderStats();
  });

  function renderStats(){
    renderSummary();
    renderGoal();
    renderTrend();
    renderDailyChart();
    renderExSummary();
    renderHistory();
  }

  window.addEventListener("resize", ()=>{
    if(screens.stats.classList.contains("active")) renderDailyChart();
  });

  /* ---------- init ---------- */
  route();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>

</body>
</html>
